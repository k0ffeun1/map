name: Build world regions draft

on:
  push:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
    paths:
      - scripts/tools/build_world_regions_draft.py
      - assets/game_data/world_region_seeds_draft.txt
      - assets/provinces.json
      - assets/game_data/provinces.json
      - assets/game_data/regions.json
      - scripts/tools/build_regions_iberia.py
      - .github/workflows/world-regions-draft.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-world-regions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subdivision-stage4-boundary-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry dependency
        run: python -m pip install 'shapely>=2,<3'
      - name: Build complete world region draft from layer 8
        run: python scripts/tools/build_world_regions_draft.py
      - name: Validate generated outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('assets/regions_world_draft.json').read_text(encoding='utf-8'))
          a=json.loads(Path('assets/game_data/world_region_assignments_draft.json').read_text(encoding='utf-8'))
          r=json.loads(Path('reports/world_regions_draft_report.json').read_text(encoding='utf-8'))
          assert g['format']=='world_regions_draft/v1'
          assert a['format']=='world_region_assignments_draft/v1'
          assert a['province_count']==4027, a['province_count']
          assert len(a['assignments'])==4027
          assert len({x['province_id'] for x in a['assignments']})==4027
          assert g['province_count']==4027
          assert r['province_count']==4027
          assert r['source_world_region_seed_count']==273
          print('WORLD_REGION_VALIDATE_OK', 'provinces=',a['province_count'], 'regions=',g['region_count'], 'pieces=',g['polygon_piece_count'], 'review=',r['review_assignment_count'], 'empty=',r['empty_world_table_region_count'])
          PY
      - name: Commit generated draft assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/regions_world_draft.json assets/game_data/world_region_assignments_draft.json reports/world_regions_draft_report.json
          if git diff --cached --quiet; then
            echo "World region draft unchanged"
            exit 0
          fi
          git commit -m "Generate complete world region draft"
          git pull --rebase origin feature/subdivision-stage4-boundary-cleanup
          git push origin HEAD:feature/subdivision-stage4-boundary-cleanup
