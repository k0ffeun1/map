name: Layer 8 small province merge plan

on:
  push:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
    paths:
      - scripts/tools/build_layer8_small_province_merge_plan.py
      - scripts/tools/refine_layer8_small_province_merge_plan_geographic.py
      - scripts/tools/finalize_layer8_small_province_merge_plan.py
      - scripts/tools/apply_layer8_small_province_merge_plan.py
      - scripts/tools/build_layer8_normalized_cell_targets.py
      - scripts/tools/audit_layer8_normalized_one_cell_extremes.py
      - assets/map_geometry/provinces.json
      - assets/game_data/provinces.json
      - assets/game_data/world_province_cell_targets.json
      - assets/game_data/world_region_assignments_draft.json
      - assets/game_data/world_island_region_rules.json
      - assets/game_data/world_superregion_rules.json
      - .github/workflows/layer8-small-province-merge-plan.yml
  pull_request:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
    paths:
      - scripts/tools/build_layer8_small_province_merge_plan.py
      - scripts/tools/refine_layer8_small_province_merge_plan_geographic.py
      - scripts/tools/finalize_layer8_small_province_merge_plan.py
      - scripts/tools/apply_layer8_small_province_merge_plan.py
      - scripts/tools/build_layer8_normalized_cell_targets.py
      - scripts/tools/audit_layer8_normalized_one_cell_extremes.py
      - assets/map_geometry/provinces.json
      - assets/game_data/provinces.json
      - assets/game_data/world_province_cell_targets.json
      - assets/game_data/world_region_assignments_draft.json
      - assets/game_data/world_island_region_rules.json
      - assets/game_data/world_superregion_rules.json
      - .github/workflows/layer8-small-province-merge-plan.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-plan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subdivision-stage4-boundary-cleanup
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry dependency
        run: python -m pip install 'shapely>=2.0,<3'
      - name: Build non-destructive merge plan
        run: python scripts/tools/build_layer8_small_province_merge_plan.py --check
      - name: Validate base merge invariants
        run: |
          python - <<'PY'
          import json
          d=json.load(open('reports/layer8_small_province_merge_plan.json', encoding='utf-8'))
          s=d['summary']; v=d['validations']
          assert s['layer8_record_count'] == 4027
          assert s['raw_one_cell_under_500_count'] == 878
          assert v['hard_lock_violation_count'] == 0
          assert v['protected_island_absorption_violation_count'] == 0
          assert v['low_countries_superregion_constraint_violation_count'] == 0
          assert v['non_increasing_small_target_count'] == 0
          assert v['slovenia_all_locked'] is True
          assert v['greater_london_locked'] is True
          print(json.dumps({'summary': s, 'validations': v}, ensure_ascii=False, indent=2))
          PY
      - name: Refine isolated targets by real geographic distance
        run: python scripts/tools/refine_layer8_small_province_merge_plan_geographic.py --check
      - name: Finalize hard gameplay merge rules
        run: python scripts/tools/finalize_layer8_small_province_merge_plan.py --check
      - name: Validate final merge plan
        run: |
          python - <<'PY'
          import json
          d=json.load(open('reports/layer8_small_province_merge_plan.json', encoding='utf-8'))
          s=d['summary']; v=d['validations']
          assert s['layer8_record_count'] == 4027
          assert s['logical_family_count'] == 2903
          assert s['automatic_merge_count'] >= 1
          assert v['final_cross_country_auto_merge_count'] == 0
          assert v['final_over_distance_auto_merge_count'] == 0
          assert v['final_protected_render_split_target_count'] == 0
          assert v['final_merge_cycle_count'] == 0
          assert v['hard_lock_violation_count'] == 0
          assert v['protected_island_absorption_violation_count'] == 0
          assert v['low_countries_superregion_constraint_violation_count'] == 0
          print(json.dumps({'summary': s, 'validations': v, 'finalization': d['finalization']}, ensure_ascii=False, indent=2))
          PY
      - name: Apply logical gameplay parent grouping
        run: python scripts/tools/apply_layer8_small_province_merge_plan.py --check
      - name: Validate normalized gameplay groups
        run: |
          python - <<'PY'
          import json
          d=json.load(open('reports/layer8_normalized_province_groups.json', encoding='utf-8'))
          s=d['summary']; v=d['validation']
          assert s['render_record_count'] == 4027
          assert s['source_family_count'] == 2903
          assert s['gameplay_parent_count'] == 2886
          assert v['render_record_coverage_ok'] is True
          assert v['family_coverage_ok'] is True
          assert v['group_count_ok'] is True
          assert v['cross_country_gameplay_parent_count'] == 0
          assert v['protected_source_absorbed_count'] == 0
          assert v['slovenia_unchanged'] is True
          assert v['greater_london_unchanged'] is True
          assert v['canary_gameplay_parent_count'] == 2
          assert v['canary_grouping_ok'] is True
          print(json.dumps({'summary': s, 'validation': v}, ensure_ascii=False, indent=2))
          PY
      - name: Build normalized gameplay cell targets
        run: python scripts/tools/build_layer8_normalized_cell_targets.py --check
      - name: Audit normalized one-cell extremes
        run: python scripts/tools/audit_layer8_normalized_one_cell_extremes.py --check
      - name: Validate large one-cell cleanup
        run: |
          python - <<'PY'
          import json
          d=json.load(open('reports/layer8_normalized_one_cell_extremes.json', encoding='utf-8'))
          s=d['summary']
          assert s['gameplay_parent_count'] == 2886
          assert s['one_cell_ge_20000_count'] == 0
          print(json.dumps(s, ensure_ascii=False, indent=2))
          PY
      - name: Persist generated plan, gameplay groups, targets and reports
        run: |
          FILES='assets/game_data/layer8_small_province_merge_plan.json assets/game_data/layer8_normalized_province_groups.json assets/game_data/layer8_normalized_cell_targets.json reports/layer8_small_province_merge_plan.json reports/layer8_small_province_merge_plan.md reports/layer8_normalized_province_groups.json reports/layer8_normalized_province_groups.md reports/layer8_normalized_cell_targets.json reports/layer8_normalized_cell_targets.md reports/layer8_normalized_one_cell_extremes.json reports/layer8_normalized_one_cell_extremes.md'
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo 'Generated merge/target data unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/game_data/layer8_small_province_merge_plan.json assets/game_data/layer8_normalized_province_groups.json assets/game_data/layer8_normalized_cell_targets.json reports/layer8_small_province_merge_plan.json reports/layer8_small_province_merge_plan.md reports/layer8_normalized_province_groups.json reports/layer8_normalized_province_groups.md reports/layer8_normalized_cell_targets.json reports/layer8_normalized_cell_targets.md reports/layer8_normalized_one_cell_extremes.json reports/layer8_normalized_one_cell_extremes.md
          git commit -m 'Пересчитать нормализованные gameplay-провинции и цели клеток'
          git push origin HEAD:feature/subdivision-stage4-boundary-cleanup
