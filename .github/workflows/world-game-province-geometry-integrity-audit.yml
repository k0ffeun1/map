name: Audit world game province geometry integrity

on:
  push:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
    paths:
      - scripts/tools/audit_world_game_province_geometry_integrity.py
      - assets/provinces.json
      - assets/game_data/provinces.json
      - assets/game_data/world_province_cell_targets.json
      - .github/workflows/world-game-province-geometry-integrity-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subdivision-stage4-boundary-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry dependency
        run: python -m pip install 'shapely>=2,<3'
      - name: Build geometry integrity audit
        run: python scripts/tools/audit_world_game_province_geometry_integrity.py
      - name: Validate audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/world_game_province_geometry_integrity_audit.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['format']=='world_game_province_geometry_integrity_audit/v1'
          assert r['summary']['identity_count']==4027
          assert r['summary']['geometry_count']==4027
          assert r['summary']['valid_geometry_count']==4027
          assert r['summary']['split_candidate_count']==366
          assert r['summary']['blocked_split_candidate_count'] + r['summary']['geometry_safe_split_candidate_count'] == 366
          print('WORLD_GAME_PROVINCE_GEOMETRY_INTEGRITY_AUDIT_OK', r['summary'])
          PY
      - name: Persist reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/world_game_province_geometry_integrity_audit.json reports/world_game_province_geometry_integrity_audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate world province geometry integrity audit'
          git pull --rebase origin feature/subdivision-stage4-boundary-cleanup
          git push origin HEAD:feature/subdivision-stage4-boundary-cleanup
