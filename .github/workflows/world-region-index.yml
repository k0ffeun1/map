name: World region province index

on:
  push:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
    paths:
      - scripts/tools/build_world_province_index.py
      - assets/provinces.json
      - assets/game_data/provinces.json
      - .github/workflows/world-region-index.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subdivision-stage4-boundary-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build compact world province index
        run: python scripts/tools/build_world_province_index.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- reports/world_province_index.txt && git ls-files --error-unmatch reports/world_province_index.txt >/dev/null 2>&1; then
            echo "Index unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/world_province_index.txt
          git commit -m "Generate world province region index"
          git push origin HEAD:feature/subdivision-stage4-boundary-cleanup
