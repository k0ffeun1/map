name: Build Slovenia Admin-1 normalized preview

on:
  push:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
    paths:
      - scripts/tools/build_slovenia_admin1_normalized_preview.py
      - assets/game_data/world_admin1_source_manifest.json
      - assets/map_geometry/world_admin1_safe_pieces.json
      - .github/workflows/slovenia-admin1-normalized-preview.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subdivision-stage4-boundary-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GIS dependency
        run: python -m pip install 'shapely>=2,<3'
      - name: Build Slovenia normalized preview
        run: python scripts/tools/build_slovenia_admin1_normalized_preview.py
      - name: Validate preview
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/slovenia_admin1_normalized_preview.json').read_text(encoding='utf-8'))
          s=r['summary']
          assert s['source_feature_count']==193, s
          assert s['normalized_parent_count']==12, s
          assert s['source_used_exactly_once'] is True, s
          assert s['union_match_ratio'] >= 0.999999, s
          print('SLOVENIA_ADMIN1_PREVIEW_OK', s)
          PY
      - name: Persist preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/game_data/slovenia_admin1_normalized_preview.json \
            assets/map_geometry/slovenia_admin1_normalized_preview_pieces.json \
            reports/slovenia_admin1_normalized_preview.json \
            reports/slovenia_admin1_normalized_preview.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate Slovenia Admin-1 normalized preview'
          git pull --rebase origin feature/subdivision-stage4-boundary-cleanup
          git push origin HEAD:feature/subdivision-stage4-boundary-cleanup
