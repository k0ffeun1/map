name: Britain and North Atlantic source audit

on:
  push:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
    paths:
      - scripts/tools/audit_britain_north_atlantic_sources.py
      - assets/provinces.json
      - assets/game_data/world_province_cell_targets.json
      - .github/workflows/britain-north-atlantic-source-audit.yml
  pull_request:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
    paths:
      - scripts/tools/audit_britain_north_atlantic_sources.py
      - assets/provinces.json
      - assets/game_data/world_province_cell_targets.json
      - .github/workflows/britain-north-atlantic-source-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Britain and North Atlantic sources
        run: python scripts/tools/audit_britain_north_atlantic_sources.py
      - name: Print compact source report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/britain_north_atlantic_source_audit.json').read_text(encoding='utf-8'))
          print('TOTAL', r['selected_render_record_count'], r['selected_source_family_count'])
          for name, s in r['bucket_summary'].items():
              print('SUMMARY', name, json.dumps(s, ensure_ascii=False))
          print('PREFIX_COUNTS', json.dumps(r['country_prefix_counts'], ensure_ascii=False))
          for row in r['rows']:
              print('ROW', json.dumps(row, ensure_ascii=False))
          for item in r['multipart_source_families']:
              print('MULTIPART', json.dumps(item, ensure_ascii=False))
          PY
