name: Historical hierarchy UI smoke

on:
  push:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
    paths:
      - scripts/HistoricalHierarchyWorldViewer.gd
      - scripts/HistoricalHierarchyHotkeyBridge.gd
      - scripts/HistoricalHierarchyWorldViewerV3.gd
      - scripts/HistoricalHierarchyCatalogV3.gd
      - scripts/HistoricalHierarchyAssignmentBuilder.gd
      - assets/game_data/historical_hierarchy_v1/**
      - assets/land_cells_normalized/**
      - scenes/Main.tscn
      - .github/workflows/historical-hierarchy-ui-smoke.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subdivision-stage4-boundary-cleanup
          fetch-depth: 1

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Run hierarchy palette and selection test
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          : > diagnostics/historical_hierarchy_ui_smoke.txt
          echo "commit=${GITHUB_SHA}" >> diagnostics/historical_hierarchy_ui_smoke.txt
          echo "godot=$(godot --version 2>&1)" >> diagnostics/historical_hierarchy_ui_smoke.txt

          timeout 240s godot --headless --path . --editor --quit >> diagnostics/historical_hierarchy_ui_smoke.txt 2>&1
          echo "PARSE_RC=$?" >> diagnostics/historical_hierarchy_ui_smoke.txt

          cat > /tmp/hierarchy_ui_test.gd <<'GDSCRIPT'
          extends SceneTree

          var main: Node
          var viewer: Node
          var bridge: Node

          func _init() -> void:
              var scene := load("res://scenes/Main.tscn") as PackedScene
              if scene == null:
                  push_error("MAIN_LOAD_FAILED")
                  quit(101)
                  return
              main = scene.instantiate()
              root.add_child(main)
              process_frame.connect(_frame1, CONNECT_ONE_SHOT)

          func _frame1() -> void:
              viewer = main.get_node_or_null("HistoricalHierarchyWorldViewer")
              bridge = main.get_node_or_null("HistoricalHierarchyHotkeyBridge")
              if viewer == null or bridge == null:
                  push_error("VIEWER_OR_BRIDGE_MISSING")
                  quit(102)
                  return
              process_frame.connect(_frame2, CONNECT_ONE_SHOT)

          func _frame2() -> void:
              viewer.call("set_active_mode", "region")
              process_frame.connect(_check_region, CONNECT_ONE_SHOT)

          func _check_region() -> void:
              var err := str(viewer.get("_last_error"))
              if not err.is_empty():
                  push_error("REGION_MODE_ERROR: %s" % err)
                  quit(103)
                  return
              var palettes: Dictionary = viewer.get("_palette_by_mode")
              var region_palette_value: Variant = palettes.get("region", {})
              if not region_palette_value is Dictionary:
                  push_error("REGION_PALETTE_MISSING")
                  quit(104)
                  return
              var region_palette: Dictionary = region_palette_value
              var unique_colors: Dictionary = {}
              for c in region_palette.values():
                  if c is Color:
                      unique_colors[(c as Color).to_html(true)] = true
              print("REGION_PALETTE total=", region_palette.size(), " unique=", unique_colors.size())
              if region_palette.size() != 897 or unique_colors.size() != 897:
                  push_error("REGION_PALETTE_NOT_UNIQUE total=%d unique=%d" % [region_palette.size(), unique_colors.size()])
                  quit(105)
                  return

              var assignments: Dictionary = viewer.get("_assignments")
              var first_parent := str(assignments.keys()[0])
              viewer.call("_select_parent_group", first_parent)
              process_frame.connect(_check_region_info, CONNECT_ONE_SHOT)

          func _check_region_info() -> void:
              var label := bridge.get("_selection_info") as Label
              if label == null:
                  push_error("SELECTION_LABEL_MISSING")
                  quit(106)
                  return
              print("REGION_INFO=", label.text.replace("\n", " | "))
              if not label.text.contains("Тип: регион") or not label.text.contains("Суперрегион:"):
                  push_error("REGION_INFO_INCOMPLETE: %s" % label.text)
                  quit(107)
                  return
              viewer.call("set_active_mode", "superregion")
              process_frame.connect(_check_super, CONNECT_ONE_SHOT)

          func _check_super() -> void:
              var palettes: Dictionary = viewer.get("_palette_by_mode")
              var super_palette_value: Variant = palettes.get("superregion", {})
              if not super_palette_value is Dictionary:
                  push_error("SUPER_PALETTE_MISSING")
                  quit(108)
                  return
              var super_palette: Dictionary = super_palette_value
              var unique_colors: Dictionary = {}
              for c in super_palette.values():
                  if c is Color:
                      unique_colors[(c as Color).to_html(true)] = true
              print("SUPER_PALETTE total=", super_palette.size(), " unique=", unique_colors.size())
              if super_palette.size() != 193 or unique_colors.size() != 193:
                  push_error("SUPER_PALETTE_NOT_UNIQUE total=%d unique=%d" % [super_palette.size(), unique_colors.size()])
                  quit(109)
                  return

              var assignments: Dictionary = viewer.get("_assignments")
              var first_parent := str(assignments.keys()[0])
              viewer.call("_select_parent_group", first_parent)
              process_frame.connect(_check_super_info, CONNECT_ONE_SHOT)

          func _check_super_info() -> void:
              var label := bridge.get("_selection_info") as Label
              print("SUPER_INFO=", label.text.replace("\n", " | "))
              if not label.text.contains("Тип: суперрегион") or not label.text.contains("Регионов:"):
                  push_error("SUPER_INFO_INCOMPLETE: %s" % label.text)
                  quit(110)
                  return
              print("HIERARCHY_PALETTE_AND_INFO_OK")
              quit(0)
          GDSCRIPT

          timeout 240s godot --headless --path . --script /tmp/hierarchy_ui_test.gd >> diagnostics/historical_hierarchy_ui_smoke.txt 2>&1
          echo "RUNTIME_RC=$?" >> diagnostics/historical_hierarchy_ui_smoke.txt

      - name: Commit diagnostic log
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/historical_hierarchy_ui_smoke.txt
          git diff --cached --quiet && exit 0
          git commit -m "Record hierarchy palette UI diagnostics"
          git push origin HEAD:feature/subdivision-stage4-boundary-cleanup
