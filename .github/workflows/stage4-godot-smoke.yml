name: Stage 4 Godot smoke test

on:
  push:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply candidate Stage 4 parse fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/SubdivisionBoundaryCleanupStage.gd')
          text = path.read_text(encoding='utf-8')
          old = '''func _input(event: InputEvent) -> void:\n\tif not event is InputEventKey or not event.pressed or event.echo:\n\t\treturn\n\tvar key := event.physical_keycode\n'''
          new = '''func _input(event: InputEvent) -> void:\n\tvar key_event := event as InputEventKey\n\tif key_event == null or not key_event.pressed or key_event.echo:\n\t\treturn\n\tvar key: Key = key_event.physical_keycode\n'''
          if old not in text:
              raise SystemExit('expected Stage 4 input block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Import project headless
        run: godot --headless --path . --editor --quit

      - name: Smoke-test Stage 4 loader
        shell: bash
        run: |
          cat > /tmp/stage4_smoke_test.gd <<'GDSCRIPT'
          extends SceneTree

          func _init() -> void:
              print("STAGE4_SMOKE: before load")
              var stage_script = load("res://scripts/SubdivisionBoundaryCleanupStage.gd")
              print("STAGE4_SMOKE: after load")
              if stage_script == null or not stage_script.can_instantiate():
                  push_error("STAGE4_LOAD_FAILED")
                  quit(1)
                  return
              print("STAGE4_SMOKE: before new")
              var node = stage_script.new()
              print("STAGE4_SMOKE: after new")
              print("STAGE4_SMOKE: before add_child")
              root.add_child(node)
              print("STAGE4_SMOKE: after add_child")
              var error_text := ""
              if node.has_method("get_last_error"):
                  error_text = str(node.call("get_last_error"))
              print("STAGE4_LAST_ERROR=", error_text)
              if not error_text.is_empty():
                  quit(2)
                  return
              print("STAGE4_OK")
              quit(0)
          GDSCRIPT
          set -o pipefail
          timeout 25s godot --headless --path . --script /tmp/stage4_smoke_test.gd | tee /tmp/stage4-smoke.log
