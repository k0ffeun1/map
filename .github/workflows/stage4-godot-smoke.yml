name: Stage 4 Godot smoke test

on:
  push:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
  pull_request:
    branches:
      - master
      - feature/subdivision-stage4-boundary-cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Import project headless
        run: godot --headless --path . --editor --quit

      - name: Smoke-test Stage 4 loader
        shell: bash
        run: |
          cat > /tmp/stage4_loader_test.gd <<'GDSCRIPT'
          extends SceneTree

          func _init() -> void:
              var stage_script = load("res://scripts/SubdivisionBoundaryCleanupStage.gd")
              if stage_script == null or not stage_script.can_instantiate():
                  push_error("STAGE4_LOAD_FAILED")
                  quit(1)
                  return
              var node = stage_script.new()
              root.add_child(node)
              var error_text := str(node.call("get_last_error")) if node.has_method("get_last_error") else "missing get_last_error"
              print("STAGE4_LAST_ERROR=", error_text)
              if not error_text.is_empty():
                  quit(2)
                  return
              print("STAGE4_LOADER_OK")
              quit(0)
          GDSCRIPT
          timeout 25s godot --headless --path . --script /tmp/stage4_loader_test.gd

      - name: Smoke-test U input bridge and 2km coast
        shell: bash
        run: |
          cat > /tmp/stage4_u_test.gd <<'GDSCRIPT'
          extends SceneTree

          var _bridge: Node

          func _init() -> void:
              var bridge_script = load("res://scripts/SubdivisionStage4InputBridge.gd")
              if bridge_script == null or not bridge_script.can_instantiate():
                  push_error("STAGE4_BRIDGE_LOAD_FAILED")
                  quit(3)
                  return

              var viewer := Node2D.new()
              root.add_child(viewer)
              _bridge = bridge_script.new()
              viewer.add_child(_bridge)
              process_frame.connect(_press_u_after_ready, CONNECT_ONE_SHOT)

          func _press_u_after_ready() -> void:
              var event := InputEventKey.new()
              event.pressed = true
              event.physical_keycode = KEY_U
              _bridge.call("_input", event)
              process_frame.connect(_check_stage4_after_ready, CONNECT_ONE_SHOT)

          func _check_stage4_after_ready() -> void:
              var stage = _bridge.get("_stage4")
              if not is_instance_valid(stage):
                  push_error("STAGE4_U_DID_NOT_CREATE_STAGE")
                  quit(4)
                  return
              var error_text := str(stage.call("get_last_error")) if stage.has_method("get_last_error") else "missing get_last_error"
              if not error_text.is_empty():
                  push_error("STAGE4_U_LOAD_ERROR: %s" % error_text)
                  quit(5)
                  return
              if not bool(stage.get("visible")):
                  push_error("STAGE4_U_DID_NOT_ENABLE_STAGE")
                  quit(6)
                  return
              if not stage.has_method("get_gameplay_coast_margin_km"):
                  push_error("STAGE4_2KM_RULE_API_MISSING")
                  quit(7)
                  return
              var margin_km := float(stage.call("get_gameplay_coast_margin_km"))
              if absf(margin_km - 2.0) > 0.0001:
                  push_error("STAGE4_WRONG_COAST_MARGIN: %f" % margin_km)
                  quit(8)
                  return
              var coast_source := str(stage.call("get_gameplay_coast_source_path")) if stage.has_method("get_gameplay_coast_source_path") else ""
              if coast_source != "res://assets/provinces_iberia_selection_2km.json":
                  push_error("STAGE4_WRONG_COAST_SOURCE: %s" % coast_source)
                  quit(9)
                  return
              var inset_count := int(stage.call("get_coast_inset_endpoint_count")) if stage.has_method("get_coast_inset_endpoint_count") else 0
              print("STAGE4_COAST_MARGIN_KM=", margin_km)
              print("STAGE4_COAST_SOURCE=", coast_source)
              print("STAGE4_COAST_ENDPOINTS_MOVED=", inset_count)
              if inset_count <= 0:
                  push_error("STAGE4_2KM_COAST_DID_NOT_MOVE_ANY_BOUNDARY_ENDPOINT")
                  quit(10)
                  return
              print("STAGE4_U_2KM_OK")
              quit(0)
          GDSCRIPT
          timeout 25s godot --headless --path . --script /tmp/stage4_u_test.gd
