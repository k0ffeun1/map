name: Apply world island region logic

on:
  push:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
    paths:
      - scripts/tools/build_world_island_region_rules.py
      - scripts/tools/apply_world_island_logic.py
      - scripts/tools/build_world_regions_island_corrected.py
      - assets/game_data/world_region_assignments_draft.json
      - assets/game_data/world_province_cell_targets.json
      - assets/game_data/world_region_cell_profiles.json
      - assets/game_data/provinces.json
      - assets/provinces.json
      - assets/map_geometry/provinces.json
      - .github/workflows/world-island-logic.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subdivision-stage4-boundary-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely>=2,<3'

      - name: Build island rules
        run: python scripts/tools/build_world_island_region_rules.py

      - name: Apply island logic
        run: python scripts/tools/apply_world_island_logic.py

      - name: Build corrected region geometry from canonical layer 8
        run: python scripts/tools/build_world_regions_island_corrected.py

      - name: Determinism check
        run: |
          python scripts/tools/apply_world_island_logic.py --check
          python scripts/tools/build_world_regions_island_corrected.py --check

      - name: Validate island contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('assets/game_data/world_region_assignments_island_corrected.json').read_text(encoding='utf-8'))
          t=json.loads(Path('assets/game_data/world_province_cell_targets_island_corrected.json').read_text(encoding='utf-8'))
          r=json.loads(Path('reports/world_island_logic_report.json').read_text(encoding='utf-8'))
          g=json.loads(Path('assets/regions_world_island_corrected.json').read_text(encoding='utf-8'))
          rules=json.loads(Path('assets/game_data/world_island_region_rules.json').read_text(encoding='utf-8'))
          assert a['format']=='world_region_assignments_island_corrected/v2'
          assert t['format']=='world_province_cell_targets_island_corrected/v2'
          assert r['format']=='world_island_logic_report/v2'
          assert g['format']=='world_regions_island_corrected/v1'
          assert rules['format']=='world_island_region_rules/v2'
          assert a['province_count']==4027
          assert t['province_count']==4027
          assert g['province_count']==4027
          assert g['canonical_geometry_count']==4027 if 'canonical_geometry_count' in g else True
          assert g.get('source_geometry','').endswith('assets/provinces.json')
          gotland=[x for x in a['assignments'] if x.get('legacy_id','').startswith('sweden__gotland')]
          assert len(gotland)>=2 and len({x['region_id'] for x in gotland})==1
          scot=[x for x in a['assignments'] if any(k in x.get('legacy_id','') for k in ('orkney','shetland'))]
          assert scot and all(x['region_name']=='Шотландское нагорье' for x in scot)
          atl=[x for x in a['assignments'] if x.get('region_name')=='Атлантические острова Европы']
          prefixes={x.get('legacy_id','').split('__',1)[0] for x in atl}
          assert {'iceland','faroe_islands'}.issubset(prefixes)
          assert any(x.get('legacy_id','').startswith('portugal__azores') for x in atl)
          assert any(x.get('legacy_id','').startswith('portugal__madeira') for x in atl)
          assert any(x.get('legacy_id','').startswith('spain__las_palmas') for x in atl)
          assert any(x.get('legacy_id','').startswith('spain__santa_cruz_de_tenerife') for x in atl)
          print('WORLD_ISLAND_LOGIC_VALIDATE_OK', 'corrections=',r['region_correction_count'], 'family_mismatch_before=',r['family_region_mismatch_count_before'], 'atlantic_pieces=',len(atl), 'cells=',r['total_target_cells_after'], 'review=',r['region_assignment_review_count_after'], 'region_parts=',g['polygon_piece_count'], 'source=',g.get('source_geometry'))
          PY

      - name: Persist island outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/game_data/world_island_region_rules.json \
            assets/game_data/world_region_assignments_island_corrected.json \
            assets/game_data/world_province_cell_targets_island_corrected.json \
            assets/regions_world_island_corrected.json \
            reports/world_island_region_rules.json \
            reports/world_island_logic_report.json \
            reports/world_regions_island_corrected.json
          if git diff --cached --quiet; then
            echo 'Island outputs already current'
            exit 0
          fi
          git commit -m 'Generate island-corrected world region assignments'
          git pull --rebase origin feature/subdivision-stage4-boundary-cleanup
          git push origin HEAD:feature/subdivision-stage4-boundary-cleanup
