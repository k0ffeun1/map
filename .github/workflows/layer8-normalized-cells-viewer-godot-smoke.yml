name: Layer 8 normalized cells viewer Godot smoke

on:
  push:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
    paths:
      - scripts/Layer8NormalizedCellsViewer.gd
      - scripts/Layer8MergeResultPieceNode.gd
      - scenes/Main.tscn
      - assets/land_cells_normalized/control_preview.json
      - .github/workflows/layer8-normalized-cells-viewer-godot-smoke.yml
  pull_request:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
    paths:
      - scripts/Layer8NormalizedCellsViewer.gd
      - scripts/Layer8MergeResultPieceNode.gd
      - scenes/Main.tscn
      - assets/land_cells_normalized/control_preview.json
      - .github/workflows/layer8-normalized-cells-viewer-godot-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subdivision-stage4-boundary-cleanup
          fetch-depth: 1
      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Parse project in Godot
        run: godot --headless --path . --editor --quit
      - name: Smoke-test F6/F5 normalized-cell viewer
        run: |
          cat > /tmp/layer8_normalized_cells_viewer_test.gd <<'GDSCRIPT'
          extends SceneTree
          var viewer: Node2D
          var camera: Camera2D

          func _init() -> void:
              var viewer_script = load('res://scripts/Layer8NormalizedCellsViewer.gd')
              if viewer_script == null or not viewer_script.can_instantiate():
                  push_error('NORMALIZED_CELLS_VIEWER_SCRIPT_LOAD_FAILED')
                  quit(101)
                  return
              var host := Node2D.new()
              host.name = 'Host'
              root.add_child(host)
              camera = Camera2D.new()
              camera.name = 'Camera2D'
              host.add_child(camera)
              var ui := CanvasLayer.new()
              ui.name = 'UI'
              host.add_child(ui)
              var status := Label.new()
              status.name = 'StatusLabel'
              ui.add_child(status)
              viewer = viewer_script.new()
              viewer.name = 'Layer8NormalizedCellsViewer'
              host.add_child(viewer)
              process_frame.connect(_check_loaded, CONNECT_ONE_SHOT)

          func _check_loaded() -> void:
              var err := str(viewer.get('_last_error'))
              if not err.is_empty():
                  push_error('NORMALIZED_CELLS_VIEWER_LOAD_ERROR: %s' % err)
                  quit(102)
                  return
              var parents: Array = viewer.get('_parents')
              var cells: Array = viewer.get('_cells')
              if parents.size() != 6:
                  push_error('NORMALIZED_CELLS_VIEWER_BAD_PARENT_COUNT: %d' % parents.size())
                  quit(103)
                  return
              if cells.size() != 26:
                  push_error('NORMALIZED_CELLS_VIEWER_BAD_CELL_COUNT: %d' % cells.size())
                  quit(104)
                  return

              var f6 := InputEventKey.new()
              f6.pressed = true
              f6.physical_keycode = KEY_F6
              viewer.call('_input', f6)
              if not bool(viewer.call('is_active')):
                  push_error('NORMALIZED_CELLS_VIEWER_F6_DID_NOT_ACTIVATE')
                  quit(105)
                  return

              var f5 := InputEventKey.new()
              f5.pressed = true
              f5.physical_keycode = KEY_F5
              viewer.call('_input', f5)
              if int(viewer.get('_focus_index')) != 0:
                  push_error('NORMALIZED_CELLS_VIEWER_F5_BAD_INDEX: %d' % int(viewer.get('_focus_index')))
                  quit(106)
                  return
              if camera.zoom.x <= 1.0:
                  push_error('NORMALIZED_CELLS_VIEWER_F5_DID_NOT_ZOOM: %s' % camera.zoom)
                  quit(107)
                  return
              var first: Dictionary = parents[0]
              print('NORMALIZED_CELLS_VIEWER_OK parents=%d cells=%d first=%s target=%d zoom=%.2f' % [
                  parents.size(), cells.size(), str(first.get('display_name','')),
                  int(first.get('target_cell_count',0)), camera.zoom.x
              ])
              quit(0)
          GDSCRIPT
          timeout 120s godot --headless --path . --script /tmp/layer8_normalized_cells_viewer_test.gd

# CI trigger: normalized-cells-viewer
