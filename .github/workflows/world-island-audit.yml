name: Audit world island provinces

on:
  push:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
    paths:
      - scripts/tools/audit_world_islands.py
      - assets/game_data/world_region_assignments_draft.json
      - assets/game_data/world_province_cell_targets.json
      - assets/game_data/provinces.json
      - assets/map_geometry/provinces.json
      - .github/workflows/world-island-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/subdivision-stage4-boundary-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'shapely>=2,<3'
      - name: Build island audit
        run: python scripts/tools/audit_world_islands.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/world_island_audit.json').read_text(encoding='utf-8'))
          assert r['format']=='world_island_audit/v1'
          assert r['province_count']==4027
          print('WORLD_ISLAND_AUDIT_OK', 'multipart=',r['multipart_province_count'], 'named=',r['named_island_candidate_count'])
          PY
      - name: Persist audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/world_island_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate world island audit'
          git pull --rebase origin feature/subdivision-stage4-boundary-cleanup
          git push origin HEAD:feature/subdivision-stage4-boundary-cleanup
