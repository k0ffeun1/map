name: Stage 5 final subdivision

on:
  push:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
    paths:
      - scripts/tools/build_lacoruna_final_subdivision.py
      - scripts/tools/build_lacoruna_final_subdivision_locked.py
      - scripts/tools/build_stage6_universal_subdivisions.py
      - scripts/tools/build_stage6_universal_subdivisions_runner.py
      - assets/subdivision_stages/lacoruna_competitive_growth.json
      - assets/subdivision_stages/lacoruna_microcells.json
      - assets/provinces_iberia_selection_2km.json
      - scripts/SubdivisionFinalPolygonsStage.gd
      - scripts/SubdivisionStage5InputBridge.gd
      - scenes/Main.tscn
      - .github/workflows/stage5-final-subdivision.yml
  pull_request:
    paths:
      - scripts/tools/build_lacoruna_final_subdivision.py
      - scripts/tools/build_lacoruna_final_subdivision_locked.py
      - scripts/tools/build_stage6_universal_subdivisions.py
      - scripts/tools/build_stage6_universal_subdivisions_runner.py
      - assets/subdivision_stages/lacoruna_competitive_growth.json
      - assets/subdivision_stages/lacoruna_microcells.json
      - assets/provinces_iberia_selection_2km.json
      - scripts/SubdivisionFinalPolygonsStage.gd
      - scripts/SubdivisionStage5InputBridge.gd
      - scripts/SubdivisionStage6Overview.gd
      - scripts/SubdivisionStage6InputBridge.gd
      - scenes/Main.tscn
      - .github/workflows/stage5-final-subdivision.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geometry dependency
        run: pip install 'shapely>=2.0,<3' 'numpy>=1.26,<3'

      - name: Build and validate topology-locked final polygons
        run: |
          python scripts/tools/build_lacoruna_final_subdivision_locked.py
          python scripts/tools/build_lacoruna_final_subdivision_locked.py --check

      - name: Build Stage 6 control suite
        if: hashFiles('scripts/tools/build_stage6_universal_subdivisions_runner.py') != ''
        run: python scripts/tools/build_stage6_universal_subdivisions_runner.py --controls-only

      - name: Build Stage 6 Iberia and controls
        if: hashFiles('scripts/tools/build_stage6_universal_subdivisions_runner.py') != ''
        run: |
          python scripts/tools/build_stage6_universal_subdivisions_runner.py
          python scripts/tools/build_stage6_universal_subdivisions_runner.py --check

      - name: Show Stage 6 summary
        if: hashFiles('reports/stage6_universal_subdivisions.json') != ''
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('reports/stage6_universal_subdivisions.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('assets/subdivision_stage6/test_manifest.json').read_text(encoding='utf-8'))
          print('STAGE6_BUILT_PROVINCES=', report['built_province_count'])
          print('STAGE6_FAILED_PROVINCES=', report['failed_province_count'])
          print('STAGE6_ZONES=', report['zone_count'])
          print('STAGE6_STATUSES=', report['status_counts'])
          print('STAGE6_IBERIA_COUNT=', manifest['iberia_province_count'])
          for item in manifest['controls']:
              print('STAGE6_CONTROL=', item['role'], item['province_id'], item['name'])
          PY

      - name: Show Stage 5 summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('assets/subdivision_stages/lacoruna_final_subdivision.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          print('STAGE5_FORMAT=', d['format'])
          print('STAGE5_ZONES=', len(d['zones']))
          print('STAGE5_COAST_KM=', d['gameplay_coast']['land_inset_km'])
          print('STAGE5_FACES=', d['generation']['locked_polygonized_face_count'])
          print('STAGE5_MISSING=', d['validation']['coverage_missing_world_px2'])
          print('STAGE5_EXTRA=', d['validation']['coverage_extra_world_px2'])
          print('STAGE5_OVERLAP=', d['validation']['max_pair_overlap_world_px2'])
          PY

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Parse project in Godot
        run: godot --headless --path . --editor --quit

      - name: Smoke-test Y final polygon stage
        run: |
          cat > /tmp/stage5_y_test.gd <<'GDSCRIPT'
          extends SceneTree
          var bridge: Node
          func _init() -> void:
              var script = load('res://scripts/SubdivisionStage5InputBridge.gd')
              if script == null or not script.can_instantiate():
                  push_error('STAGE5_BRIDGE_LOAD_FAILED')
                  quit(11)
                  return
              var viewer := Node2D.new()
              viewer.name = 'Viewer'
              root.add_child(viewer)
              var camera := Camera2D.new()
              camera.name = 'Camera2D'
              viewer.add_child(camera)
              var ui := CanvasLayer.new()
              ui.name = 'UI'
              viewer.add_child(ui)
              bridge = script.new()
              bridge.name = 'SubdivisionStage5InputBridge'
              viewer.add_child(bridge)
              process_frame.connect(_press_y, CONNECT_ONE_SHOT)
          func _press_y() -> void:
              var event := InputEventKey.new()
              event.pressed = true
              event.physical_keycode = KEY_Y
              bridge.call('_input', event)
              process_frame.connect(_check, CONNECT_ONE_SHOT)
          func _check() -> void:
              var stage = bridge.get('_stage5')
              if not is_instance_valid(stage):
                  push_error('STAGE5_Y_DID_NOT_CREATE_STAGE')
                  quit(12)
                  return
              var err := str(stage.call('get_last_error'))
              if not err.is_empty():
                  push_error('STAGE5_Y_ERROR: %s' % err)
                  quit(13)
                  return
              if not bool(stage.get('visible')):
                  push_error('STAGE5_Y_NOT_VISIBLE')
                  quit(14)
                  return
              print('STAGE5_Y_OK')
              quit(0)
          GDSCRIPT
          timeout 25s godot --headless --path . --script /tmp/stage5_y_test.gd

      - name: Commit generated Stage 6 assets
        if: github.event_name == 'push' && hashFiles('assets/subdivision_stage6/final_subdivisions.json') != ''
        run: |
          if git diff --quiet -- assets/subdivision_stage6 reports/stage6_universal_subdivisions.json; then
            echo 'Stage 6 assets already current'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/subdivision_stage6 reports/stage6_universal_subdivisions.json
            git commit -m 'Generate Stage 6 universal subdivisions'
            git push origin HEAD:feature/subdivision-stage4-boundary-cleanup
          fi

      - name: Commit generated Stage 5 asset
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- assets/subdivision_stages/lacoruna_final_subdivision.json; then
            echo 'Stage 5 asset already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/subdivision_stages/lacoruna_final_subdivision.json
          git commit -m 'Generate Stage 5 final La Coruna polygons'
          git push origin HEAD:feature/subdivision-stage4-boundary-cleanup
