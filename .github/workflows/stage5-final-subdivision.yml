name: Stage 5 final subdivision

on:
  push:
    branches:
      - feature/subdivision-stage4-boundary-cleanup
    paths:
      - scripts/tools/build_lacoruna_final_subdivision.py
      - assets/subdivision_stages/lacoruna_competitive_growth.json
      - assets/subdivision_stages/lacoruna_microcells.json
      - assets/provinces_iberia_selection_2km.json
      - scripts/SubdivisionFinalPolygonsStage.gd
      - scripts/SubdivisionStage5InputBridge.gd
      - scenes/Main.tscn
      - .github/workflows/stage5-final-subdivision.yml
  pull_request:
    paths:
      - scripts/tools/build_lacoruna_final_subdivision.py
      - assets/subdivision_stages/lacoruna_competitive_growth.json
      - assets/subdivision_stages/lacoruna_microcells.json
      - assets/provinces_iberia_selection_2km.json
      - scripts/SubdivisionFinalPolygonsStage.gd
      - scripts/SubdivisionStage5InputBridge.gd
      - scenes/Main.tscn
      - .github/workflows/stage5-final-subdivision.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/subdivision-stage4-boundary-cleanup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install geometry dependency
        run: pip install 'shapely>=2.0,<3'

      - name: Diagnose Stage 5 network
        run: |
          python - <<'PY'
          import runpy, math
          from shapely.geometry import Point, LineString
          from shapely.ops import nearest_points, unary_union, polygonize
          m = runpy.run_path('scripts/tools/build_lacoruna_final_subdivision.py')
          growth = m['load_json'](m['GROWTH_PATH'])
          mesh = m['load_json'](m['MESH_PATH'])
          land = m['gameplay_area']()
          meta = {str(z.get('id','')): z for z in growth.get('zones', []) if isinstance(z, dict)}
          ids = sorted(k for k in meta if k)
          claims = {str(c.get('microcell_id','')): str(c.get('zone_id','')) for c in growth.get('claims', []) if isinstance(c, dict) and c.get('microcell_id') and c.get('zone_id')}
          source = m['source_zone_geometries'](mesh, claims, land)
          comps = m['stage4_components'](growth, claims, land)
          m['remove_cleanup_crossings'](comps)
          print('DEBUG_SOURCE_AREAS=', {z: round(source[z].area,6) for z in ids})
          print('DEBUG_COMPONENTS=', len(comps))
          print('DEBUG_PAIRS=', sorted({c['pair'] for c in comps}))
          endpoints=[]
          for i,c in enumerate(comps):
              a,b=c['clean'][0],c['clean'][-1]
              da=Point(a).distance(land.boundary); db=Point(b).distance(land.boundary)
              endpoints.extend([(i,'A',a,da),(i,'B',b,db)])
              print('DEBUG_COMP',i,c['pair'],'A=',tuple(round(v,6) for v in a),'coast=',round(da,9),'B=',tuple(round(v,6) for v in b),'coast=',round(db,9))
          for i in range(len(endpoints)):
              for j in range(i+1,len(endpoints)):
                  d=math.dist(endpoints[i][2],endpoints[j][2])
                  if d < 2.0:
                      print('DEBUG_ENDPOINT_DISTANCE',endpoints[i][0:2],endpoints[j][0:2],round(d,9))

          # Experiment: make coastline contact topologically exact without moving
          # any interior part of Stage 4. Only endpoints already on/near coast
          # are projected to the nearest point of the authoritative 2-km border.
          welded=[]
          for c in comps:
              pts=list(c['clean'])
              for idx in (0, len(pts)-1):
                  p=Point(pts[idx])
                  d=p.distance(land.boundary)
                  if d <= 0.001:
                      target=nearest_points(p, land.boundary)[1]
                      pts[idx]=(target.x,target.y)
              welded.append(LineString(pts))
          network=unary_union([land.boundary,*welded])
          welded_faces=[]
          for face in polygonize(network):
              clipped=face.intersection(land)
              for part in m['polygons'](clipped):
                  if part.area > 1e-7 and land.covers(part.representative_point()):
                      welded_faces.append(part)
          print('DEBUG_WELDED_FACES=',len(welded_faces),[round(f.area,6) for f in sorted(welded_faces,key=lambda x:x.area,reverse=True)])
          for i,face in enumerate(sorted(welded_faces,key=lambda x:x.area,reverse=True)):
              scores={z:round(face.intersection(source[z]).area,6) for z in ids}
              print('DEBUG_WELDED_FACE',i,'area=',round(face.area,6),'overlap=',scores)
          PY

      - name: Build and validate final polygons
        run: |
          python scripts/tools/build_lacoruna_final_subdivision.py
          python scripts/tools/build_lacoruna_final_subdivision.py --check

      - name: Show Stage 5 summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('assets/subdivision_stages/lacoruna_final_subdivision.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          print('STAGE5_FORMAT=', d['format'])
          print('STAGE5_ZONES=', len(d['zones']))
          print('STAGE5_COAST_KM=', d['gameplay_coast']['land_inset_km'])
          print('STAGE5_MISSING=', d['validation']['coverage_missing_world_px2'])
          print('STAGE5_EXTRA=', d['validation']['coverage_extra_world_px2'])
          print('STAGE5_OVERLAP=', d['validation']['max_pair_overlap_world_px2'])
          print('STAGE5_TOPOLOGY_LOCKED=', d['validation']['topology_locked'])
          print('STAGE5_ADJACENCY=', d['validation']['adjacency_pairs'])
          PY

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Parse project in Godot
        run: godot --headless --path . --editor --quit

      - name: Commit generated Stage 5 asset
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- assets/subdivision_stages/lacoruna_final_subdivision.json; then
            echo 'Stage 5 asset already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/subdivision_stages/lacoruna_final_subdivision.json
          git commit -m 'Generate Stage 5 final La Coruna polygons'
          git push origin HEAD:feature/subdivision-stage4-boundary-cleanup
